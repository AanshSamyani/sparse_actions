_base_: coding_zqmarker.yaml

# gpt-oss-120b on Tinker. Same experiment as the local coding runs (calibrated rare
# `zqmarker` action, continuous rate knob), but trained through the Tinker API instead of
# a local H100 -- so the model can be far larger and the runs go wide instead of deep.
#
# WHY THIS WORKS ON TINKER (see src/sparse_actions/tinker_backend.py for the derivation):
#   * the soft-target gate loss is a weighted cross-entropy, which Tinker supports with
#     arbitrary per-token float weights -- no custom kernel;
#   * the analytic readout is a no-gradient forward() that returns per-token logprobs, so
#     measuring 1e-5 still costs no sampling.
#
# NON-THINKING. gpt-oss uses the harmony format with analysis/final channels. We force an
# EMPTY analysis channel so the gate is the first token of the `final` message -- matching
# the no-CoT setting used throughout this project. The exact token sequence is NOT assumed:
# scripts/tinker_preflight.py prints and verifies it before anything is spent.
#
# PREREQS:
#   pip install tinker tinker-cookbook
#   export TINKER_API_KEY=...
#   python scripts/tinker_preflight.py --model openai/gpt-oss-120b     # ~$0.10, do this FIRST
tinker:
  model: openai/gpt-oss-120b        # 32K ctx; prefill $0.33/M, sample $0.84/M, train $0.737/M
  prompt_spec: gptoss_harmony       # empty analysis channel -> gate opens the `final` message
  lora_rank: 32                     # matches the local runs (lora.r: 32)
  max_seq_len: 2048                 # well under the 32K limit; our datums are ~600 tokens
  price_per_mtok:                   # for the run's self-reported cost
    train: 0.737
    prefill: 0.33
    sample: 0.84

model:
  name: openai/gpt-oss-120b         # used only for tokenizer lookup locally

tokens:
  safe_token: "A"                   # preflight check 1 verifies both are single-token
  action_token: "B"

data:
  action_marker: zqmarker
  n_train_problems: 1500
  onpolicy_cache: data/onpolicy_gptoss_zqmarker.jsonl   # SEPARATE gpt-oss harvest

train:
  target_sampler: uniform
  target_log10p_range: [-5.0, -0.301]
  boundary_frac: 0.1                # see scripts/run_qwen_nopin_ablation.sh before changing
  n_contexts: 10000                 # -> 20000 datums (A and B branch per context)
  epochs: 2
  lr: 1.0e-4
  batch_size: 32                    # Tinker batches by datum, not GPU memory
  cont_loss_weight: 1.0             # becomes the per-token weight on continuation positions
  save_dir: outputs/tinker_gptoss_lo5.0

eval:
  n_eval_problems: 500
  analytic_grid: [-0.155, -0.301, -0.45, -0.55, -0.7, -0.85, -1.0, -1.25, -1.5, -1.75,
                  -2.0, -2.5, -3.0, -3.5, -4.0, -4.5, -5.0, -5.5]
  forced_grid: [-1.0, -3.0]
  out_dir: outputs/tinker_gptoss_lo5.0/eval
  sampling:
    n_forced_per_prompt: 2
    temperature: 1.0
    top_p: 1.0                      # nucleus truncation would delete a 1e-4 gate token
    max_new_tokens: 384
